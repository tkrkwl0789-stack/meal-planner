<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리집 식단표</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f1;color:#253b30;font:15px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:18px}header,section{background:white;border:1px solid #dce5da;border-radius:18px;padding:16px;margin-bottom:14px}h1{margin:0;font-size:26px}small{color:#64776a}button,select,input{font:inherit;border:1px solid #cbd9cc;border-radius:9px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#38694b;color:white;border:0}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;padding:6px}.day{min-height:94px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:7px;overflow-wrap:anywhere;background:#f3f4f2;border:0}.planned{background:#e3efdf}.day span{font-size:12px}.day b{font-size:13px}.sun{color:#ba4848}.sat{color:#4169a0}.months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}dialog{border:0;border-radius:16px;width:min(90vw,420px);padding:22px}dialog input,dialog select{width:100%;margin:8px 0}dialog::backdrop{background:#0006}#status{display:block;margin-top:8px}@media(max-width:480px){main{padding:8px}section,header{padding:10px}.day{min-height:83px;padding:4px}.day b{font-size:11px}.grid{gap:3px}}</style><main><header><small>HOME MEAL PLANNER</small><h1>우리집 식단표</h1><small>2026.12 – 2027.12 · 월 / 목 / 금 / 일</small><small id="status">개인 모드 · 이 기기에 저장</small><div class="actions"><button id="login">공유 로그인</button><button id="logout" hidden>로그아웃</button></div></header><section><select id="month" aria-label="월 선택"></select><div class="nav"><button id="prev">〈</button><h2 id="heading"></h2><button id="next">〉</button></div><div class="grid" id="calendar"></div><div class="actions"><button id="shuffle">이번 달 재추천</button><button id="copy">식단 복사</button></div></section><section><h3>월별 바로가기</h3><div class="months" id="months"></div></section></main><dialog id="editor"><h3 id="editTitle"></h3><select id="choices"></select><input id="meal" placeholder="메뉴 직접 입력"><div class="actions"><button class="primary" id="save">저장</button><button id="cancel">취소</button></div></dialog><script>
const config = null; // Firebase 웹 앱 설정 객체로 교체
const menus=['돈까스','김치찌개','쭈꾸미샤브칼국수','된장찌개','삼겹살','소고기','너비아니','빨간어묵','고등어','파스타','떡볶이','부대찌개','양곰탕','육뽕탕','누룽지백숙','갈비탕','소시지','가지덮밥','김치볶음밥','라면','짜파게티','라볶이','시리얼','회사밥','제육볶음','닭갈비','순두부찌개','비빔밥','카레','불고기','잔치국수','오므라이스'];const $=id=>document.getElementById(id);let m=0,selected=0,edits={},remote=null,auth=null,api=null,unsub=null;try{edits=JSON.parse(localStorage.getItem('home-meals-v1')||'{}')}catch{};const date=(d)=>new Date(2026,11+m,d),active=d=>[0,1,4,5].includes(date(d).getDay()),key=d=>`${m}-${d}`,meal=d=>edits[key(d)]??(active(d)?menus[(m*13+d*7+Math.floor(d/7)*3)%menus.length]:'');const label=i=>i===0?'2026년 12월':`2027년 ${i}월`;function go(i){m=i;render()}function render(){$('month').value=m;$('heading').textContent=label(m);$('prev').disabled=m===0;$('next').disabled=m===12;let c=$('calendar');c.replaceChildren();['일','월','화','수','목','금','토'].forEach((v,i)=>{let e=document.createElement('div');e.className='weekday '+(i===0?'sun':i===6?'sat':'');e.textContent=v;c.append(e)});for(let i=0;i<date(1).getDay();i++)c.append(document.createElement('div'));let n=new Date(2026,12+m,0).getDate();for(let d=1;d<=n;d++){let b=document.createElement('button');b.className='day '+(meal(d)?'planned':'');let s=document.createElement('span');s.textContent=d;s.className=date(d).getDay()===0?'sun':date(d).getDay()===6?'sat':'';let t=document.createElement('b');t.textContent=meal(d)||'—';b.append(s,t);b.onclick=()=>{selected=d;$('editTitle').textContent=label(m)+' '+d+'일';$('meal').value=meal(d);$('choices').value=menus.includes(meal(d))?meal(d):'';$('editor').showModal()};c.append(b)};[...$('months').children].forEach((b,i)=>b.className=i===m?'primary':'')}
async function update(patch){try{if(remote){await api.setDoc(remote,patch,{merge:true})}else{Object.assign(edits,patch);localStorage.setItem('home-meals-v1',JSON.stringify(edits));render()}}catch(e){alert('저장 실패: '+e.message)}}for(let i=0;i<13;i++){$('month').add(new Option(label(i),i));let b=document.createElement('button');b.textContent=i===0?'26년 12월':i+'월';b.onclick=()=>go(i);$('months').append(b)}$('month').onchange=e=>go(+e.target.value);$('prev').onclick=()=>go(m-1);$('next').onclick=()=>go(m+1);['',...menus,'가지','김치','굶기'].forEach(v=>$('choices').add(new Option(v||'공란 / 직접 입력',v)));$('choices').onchange=e=>$('meal').value=e.target.value;$('save').onclick=async()=>{await update({[key(selected)]:$('meal').value.trim()});$('editor').close()};$('cancel').onclick=()=>$('editor').close();$('shuffle').onclick=()=>{if(!confirm('이번 달 예정 식단을 다시 추천할까요?'))return;let p={};for(let d=1;d<=new Date(2026,12+m,0).getDate();d++)if(active(d))p[key(d)]=menus[Math.floor(Math.random()*menus.length)];update(p)};$('copy').onclick=async()=>{let t=label(m)+' 식단표\n';for(let d=1;d<=new Date(2026,12+m,0).getDate();d++)if(meal(d))t+=`${d}일 ${meal(d)}\n`;try{await navigator.clipboard.writeText(t);alert('복사했습니다')}catch{prompt('식단을 복사하세요',t)}};render();$('login').onclick=()=>alert('공유 기능은 Firebase 설정 후 사용할 수 있습니다.');
(async()=>{if(!config)return;try{const base='https://www.gstatic.com/firebasejs/11.10.0/';const app=await import(base+'firebase-app.js'),a=await import(base+'firebase-auth.js'),f=await import(base+'firebase-firestore.js');const instance=app.initializeApp(config);auth=a.getAuth(instance);api=f;const db=f.getFirestore(instance);$('login').onclick=async()=>{try{await a.signInWithPopup(auth,new a.GoogleAuthProvider())}catch(e){alert(e.message)}};$('logout').onclick=()=>a.signOut(auth);a.onAuthStateChanged(auth,user=>{if(unsub)unsub();remote=null;$('login').hidden=!!user;$('logout').hidden=!user;if(user){remote=f.doc(db,'household','meals');$('status').textContent='공유 연결 중…';unsub=f.onSnapshot(remote,s=>{edits=s.data()||{};render();$('status').textContent='공유 모드 · 실시간 동기화'},e=>{$('status').textContent='공유 접근 실패';alert(e.message)})}else{try{edits=JSON.parse(localStorage.getItem('home-meals-v1')||'{}')}catch{edits={}}render();$('status').textContent='개인 모드 · 이 기기에 저장'}})}catch(e){$('status').textContent='공유 설정 오류: '+e.message}})();</script></html>
