async function changeMenu(old,name){return write(()=>f.runTransaction(db,async tx=>{const snap=await tx.get(ref),data=snap.data()||{},list=Array.isArray(data.menuList)?data.menuList:baseMenus;if(name&&list.includes(name))throw Error('이미 등록된 메뉴입니다.');if(old&&!list.includes(old))throw Error('이미 변경된 메뉴입니다.');const next=old?list.flatMap(x=>x===old?(name?[name]:[]):[x]):[...list,name];tx.set(ref,{menuList:next},{merge:true})}))}
for(let i=0;i<13;i++){$('month').add(new Option(label(i),i));let b=document.createElement('button');b.textContent=i===0?'26년 12월':i+'월';b.onclick=()=>go(i);$('months').append(b)}$('month').onchange=e=>go(+e.target.value);$('prev').onclick=()=>go(m-1);$('next').onclick=()=>go(m+1);$('choices').onchange=e=>$('meal').value=e.target.value;$('cancel').onclick=()=>$('editor').close();$('save').onclick=async()=>{const k=key(selected),v=$('meal').value.trim();if(await write(()=>f.setDoc(ref,{[k]:v},{merge:true})))$('editor').close()};$('addMenu').onclick=async()=>{let v=$('newMenu').value.trim();if(v&&await changeMenu('',v))$('newMenu').value=''};$('shuffle').onclick=()=>{let pool=menus.filter(x=>!['굶기','가지','김치'].includes(x));if(!pool.length)return alert('추천할 메뉴를 추가하세요.');if(!confirm('이번 달 예정 식단을 다시 추천할까요?'))return;let patch={},prev='';for(let d=1;d<=days();d++)if(active(d)){let choices=pool.filter(x=>x!==prev);if(!choices.length)choices=pool;prev=choices[Math.floor(Math.random()*choices.length)];patch[key(d)]=prev}write(()=>f.setDoc(ref,patch,{merge:true}))};$('copy').onclick=async()=>{let t=label(m)+' 식단표\n';for(let d=1;d<=days();d++)if(meal(d))t+=`${d}일 ${meal(d)}\n`;try{await navigator.clipboard.writeText(t);alert('복사했습니다')}catch{prompt('식단 복사',t)}};

function navOpen(v){$('sidebar').classList.toggle('open',v);$('toggleNav').setAttribute('aria-expanded',String(v))}
$('toggleNav').onclick=()=>navOpen(true);$('closeNav').onclick=()=>navOpen(false);
for(const b of document.querySelectorAll('[data-page]'))b.onclick=()=>{for(const p of document.querySelectorAll('.page'))p.hidden=p.id!==b.dataset.page;for(const x of document.querySelectorAll('[data-page]'))x.classList.toggle('current',x===b);navOpen(false)};
const extras=k=>Array.isArray(edits[k])?edits[k]:[];
function updateExtra(k,fn){return write(()=>f.runTransaction(db,async tx=>{const snap=await tx.get(ref);const old=snap.data()?.[k];tx.set(ref,{[k]:fn(Array.isArray(old)?old:[])},{merge:true})}))}
function addEntry(k,obj){return updateExtra(k,rows=>[...rows,{...obj,id:crypto.randomUUID()}])}
function removeEntry(k,id){if(confirm('삭제할까요?'))updateExtra(k,rows=>rows.filter(x=>x.id!==id))}
function modifyEntry(k,id,patch){return updateExtra(k,rows=>rows.map(x=>x.id===id?{...x,...patch}:x))}
function entry(target,title,detail,buttons){const el=document.createElement('div');el.className='entry';const h=document.createElement('strong');h.textContent=title;const p=document.createElement('p');p.textContent=detail;el.append(h,p);const a=document.createElement('div');a.className='actions';for(const [label,fn] of buttons){const b=document.createElement('button');b.textContent=label;b.disabled=!ready||busy;b.onclick=fn;a.append(b)}el.append(a);$(target).append(el);return p}
function renderExtras(){const choice=$('foodChoice'),old=choice.value;choice.replaceChildren(...menus.map(x=>new Option(x,x)));if(menus.includes(old))choice.value=old;for(const id of ['ingredientAdd','expiryAdd','requestAdd'])$(id).disabled=!ready||busy;for(const id of ['ingredientRows','expiryRows','requestRows'])$(id).replaceChildren();for(const x of extras('ingredients'))entry('ingredientRows',x.food,x.text,[['수정',()=>{const t=prompt('재료 수정',x.text);if(t?.trim())modifyEntry('ingredients',x.id,{text:t.trim()})}],['삭제',()=>removeEntry('ingredients',x.id)]]);for(const x of [...extras('expiry')].sort((a,b)=>a.date.localeCompare(b.date))){const now=new Date();const diff=Math.round((new Date(x.date+'T00:00:00')-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);const p=entry('expiryRows',x.name,x.date+' · '+(diff<0?'기한 지남 '+(-diff)+'일':diff===0?'오늘까지':'D-'+diff),[['수정',()=>{const name=prompt('재료 이름',x.name);if(!name?.trim())return;const date=prompt('기한 (YYYY-MM-DD)',x.date);if(validDate(date))modifyEntry('expiry',x.id,{name:name.trim(),date});else alert('올바른 날짜를 입력하세요.')}],['삭제',()=>removeEntry('expiry',x.id)]]);if(diff<=3)p.className='warn'}for(const x of extras('requests'))entry('requestRows',x.done?'✓ 완료':'진행 중',x.text,[ [x.done?'다시 열기':'완료',()=>modifyEntry('requests',x.id,{done:!x.done})],['수정',()=>{const t=prompt('요청 수정',x.text);if(t?.trim())modifyEntry('requests',x.id,{text:t.trim()})}],['삭제',()=>removeEntry('requests',x.id)]]);for(const id of ['ingredientRows','expiryRows','requestRows'])if(!$(id).children.length)$(id).textContent='등록된 항목이 없습니다.'}
function validDate(v){return typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(Date.parse(v))&&new Date(v).toISOString().slice(0,10)===v}
$('ingredientAdd').onclick=async()=>{const food=$('foodChoice').value,text=$('ingredientText').value.trim();if(!food||!text)return alert('음식과 재료를 입력하세요.');if(await updateExtra('ingredients',rows=>[...rows.filter(x=>x.food!==food),{id:crypto.randomUUID(),food,text}]))$('ingredientText').value=''};
$('expiryAdd').onclick=async()=>{const name=$('expiryName').value.trim(),date=$('expiryDate').value;if(!name||!validDate(date))return alert('재료와 날짜를 입력하세요.');if(await addEntry('expiry',{name,date})){$('expiryName').value='';$('expiryDate').value=''}};
$('requestAdd').onclick=async()=>{const text=$('requestText').value.trim();if(!text)return;if(await addEntry('requests',{text,done:false}))$('requestText').value=''};

$('status').textContent='로그인 전 · 기본 식단 미리보기';$('login').disabled=true;render();
(async()=>{try{const base='https://www.gstatic.com/firebasejs/11.10.0/';const app=await import(base+'firebase-app.js');a=await import(base+'firebase-auth.js');f=await import(base+'firebase-firestore.js');const instance=app.initializeApp(config);auth=a.getAuth(instance);db=f.getFirestore(instance);ref=f.doc(db,'household','meals');$('login').disabled=false;$('login').onclick=async()=>{try{await a.signInWithPopup(auth,new a.GoogleAuthProvider())}catch(e){alert('로그인 실패: '+e.message+' (Chrome에서 직접 열어주세요.)')}};$('logout').onclick=()=>a.signOut(auth);a.onAuthStateChanged(auth,user=>{if(unsub)unsub();ready=false;edits={};menus=[...baseMenus];$('login').hidden=!!user;$('logout').hidden=!user;$('status').textContent=user?'공유 연결 중…':'로그인 전 · 기본 식단 미리보기';render();if(user){unsub=f.onSnapshot(ref,{includeMetadataChanges:true},snap=>{let data=snap.data()||{};edits=data;menus=Array.isArray(data.menuList)?data.menuList:[...baseMenus];ready=!snap.metadata.fromCache;$('status').textContent=snap.metadata.fromCache?'서버 연결 대기 중':snap.metadata.hasPendingWrites?'저장 중…':'공유 모드 · 실시간 동기화';render()},e=>{ready=false;edits={};menus=[...baseMenus];$('status').textContent='공유 접근 실패 · 로그인 계정 및 보안 규칙 확인';render();alert(e.message)})}})}catch(e){$('status').textContent='Firebase 연결 오류: '+e.message}})();</script></html>
